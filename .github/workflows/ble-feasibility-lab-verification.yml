name: BLE Feasibility Lab - Build Verification

on:
  push:
    branches: [main]
    paths:
      - 'ble-feasibility-lab/**'
      - '.github/workflows/ble-feasibility-lab-verification.yml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
  workflow_dispatch:
    inputs:
      skip_apk:
        description: 'Skip APK build (test only)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

jobs:
  unit-tests:
    name: JVM Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run JVM Unit Tests
        run: ./gradlew :ble-feasibility-lab:testDebugUnitTest --info --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: ble-feasibility-lab/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ble-feasibility-lab/build/test-results/testDebugUnitTest/
          retention-days: 7

  apk-build:
    name: APK Build
    needs: unit-tests
    if: ${{ needs.unit-tests.result == 'success' && github.event.inputs.skip_apk != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: '/usr/local/lib/android/sdk'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Android SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" \
            "cmake;3.22.1"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew :ble-feasibility-lab:assembleDebug --info --stacktrace

      - name: Verify APK
        id: verify_apk
        run: |
          APK_PATH=$(find ble-feasibility-lab/build/outputs/apk -name "*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "ERROR: APK not found or empty"
            exit 1
          fi
          SIZE=$(stat -c%s "$APK_PATH")
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "apk_size=$SIZE" >> $GITHUB_OUTPUT

      - name: Calculate APK SHA-256
        id: apk_sha256
        run: |
          APK_PATH=$(find ble-feasibility-lab/build/outputs/apk -name "*.apk" -type f | head -1)
          SHA256=$(sha256sum "$APK_PATH" | cut -d' ' -f1)
          echo "apk_sha256=$SHA256" >> $GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ble-feasibility-lab-apk
          path: ble-feasibility-lab/build/outputs/apk/**/*.apk
          retention-days: 7

      - name: Verify manifest/permissions
        run: |
          APK_PATH=$(find ble-feasibility-lab/build/outputs/apk -name "*.apk" -type f | head -1)
          $ANDROID_HOME/build-tools/34.0.0/aapt2 dump badging "$APK_PATH" | head -60
          echo ""
          $ANDROID_HOME/build-tools/34.0.0/aapt2 dump permissions "$APK_PATH"

      - name: Summary
        if: always()
        run: |
          echo "=== BUILD VERIFICATION SUMMARY ==="
          echo "JVM Unit Tests: ${{ needs.unit-tests.result }}"
          echo "APK Build: ${{ job.status }}"
          if [ -n "${{ steps.verify_apk.outputs.apk_path }}" ]; then
            echo "APK path: ${{ steps.verify_apk.outputs.apk_path }}"
            echo "APK size: ${{ steps.verify_apk.outputs.apk_size }} bytes"
            echo "APK SHA-256: ${{ steps.apk_sha256.outputs.apk_sha256 }}"
          fi
          echo "Java: $(java -version 2>&1 | head -1)"
          echo "Android SDK: $ANDROID_HOME"
          echo "Gradle: $(./gradlew --version | head -1)"