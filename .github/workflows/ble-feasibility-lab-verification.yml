name: BLE Feasibility Lab - Build Verification

on:
  push:
    branches: [main]
    paths:
      - 'ble-feasibility-lab/**'
      - '.github/workflows/ble-feasibility-lab-verification.yml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  workflow_dispatch:
    inputs:
      skip_apk:
        description: 'Skip APK build (test only)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

jobs:
  jvm-unit-tests:
    name: JVM Unit Tests (Pure Logic)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Kotlin
        uses: actions/setup-kotlin@v1
        with:
          version: '1.9.22'

      - name: Download kotlinx-serialization
        run: |
          mkdir -p /tmp/deps
          cd /tmp/deps
          # Download required jars
          wget -q https://repo1.maven.org/maven2/org/jetbrains/kotlinx/kotlinx-serialization-json/1.6.3/kotlinx-serialization-json-1.6.3.jar
          wget -q https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/1.9.22/kotlin-stdlib-1.9.22.jar
          wget -q https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-stdlib-common/1.9.22/kotlin-stdlib-common-1.9.22.jar
          wget -q https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-stdlib-jdk8/1.9.22/kotlin-stdlib-jdk8-1.9.22.jar
          wget -q https://repo1.maven.org/maven2/org/jetbrains/kotlinx/kotlinx-coroutines-core/1.8.0/kotlinx-coroutines-core-1.8.0.jar
          wget -q https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-stdlib-jdk7/1.9.22/kotlin-stdlib-jdk7-1.9.22.jar
          ls -la

      - name: Compile and run pure JVM tests
        run: |
          cd /home/runner/work/Ghost/Ghost
          
          # Create a simple test runner that doesn't need Android
          cat > /tmp/PureTest.kt << 'EOF'
          import kotlinx.serialization.Serializable
          import kotlinx.serialization.json.Json
          import kotlinx.serialization.decodeFromString
          import kotlinx.serialization.encodeToString
          import java.io.File
          import java.time.Instant
          import java.util.Arrays
          import java.util.concurrent.atomic.AtomicInteger
          
          @Serializable
          data class TestData(val id: String, val value: Int, val flag: Boolean)
          
          @Serializable
          data class TestDataList(val items: List<TestData>)
          
          fun main() {
              val passed = AtomicInteger(0)
              val failed = AtomicInteger(0)
              
              fun assertTrue(msg: String, condition: Boolean) {
                  if (condition) { println("✓ $msg"); passed.incrementAndGet() } else { println("✗ $msg"); failed.incrementAndGet() }
              }
              fun assertEquals(msg: String, expected: Any, actual: Any) {
                  if (expected == actual) { println("✓ $msg"); passed.incrementAndGet() } else { println("✗ $msg (expected: $expected, actual: $actual)"); failed.incrementAndGet() }
              }
              fun assertFalse(msg: String, condition: Boolean) {
                  if (!condition) { println("✓ $msg"); passed.incrementAndGet() } else { println("✗ $msg"); failed.incrementAndGet() }
              }
              
              val json = Json { ignoreUnknownKeys = true; isLenient = true; prettyPrint = true }
              
              // TimeUtil tests
              println("=== TimeUtil Tests ===")
              val now = System.currentTimeMillis()
              assertTrue("nowMillis > 0", now > 0)
              val nanos = System.nanoTime()
              assertTrue("nowNanos > 0", nanos > 0)
              
              fun formatDuration(millis: Long): String {
                  if (millis < 0) return "0ms"
                  val days = millis / 86400000
                  val hours = (millis % 86400000) / 3600000
                  val minutes = (millis % 3600000) / 60000
                  val seconds = (millis % 60000) / 1000
                  val ms = millis % 1000
                  return buildString {
                      if (days > 0) append("${days}d ")
                      if (hours > 0) append("${hours}h ")
                      if (minutes > 0) append("${minutes}m ")
                      if (seconds > 0 || (days == 0 && hours == 0 && minutes == 0)) append("${seconds}s ")
                      if (ms > 0 && days == 0 && hours == 0 && minutes == 0 && seconds == 0) append("${ms}ms")
                  }.trim()
              }
              
              assertEquals("formatDuration zero", "0s", formatDuration(0))
              assertEquals("formatDuration ms", "500ms", formatDuration(500))
              assertEquals("formatDuration s", "5s", formatDuration(5000))
              assertEquals("formatDuration m", "2m 30s", formatDuration(150000))
              assertEquals("formatDuration h", "1h 30m 15s", formatDuration(5415000))
              assertEquals("formatDuration d", "1d 2h 3m 4s", formatDuration(93784000))
              
              fun formatTimestamp(ts: Long): String = Instant.ofEpochMilli(ts).toString()
              fun parseTimestamp(s: String): Long = Instant.parse(s).toEpochMilli()
              
              val ts = Instant.parse("2024-01-01T00:00:00Z").toEpochMilli()
              assertTrue("formatTimestamp contains 2024", formatTimestamp(ts).contains("2024"))
              assertEquals("parseTimestamp", 1704067200000L, parseTimestamp("2024-01-01T00:00:00Z"))
              
              fun getCurrentTimeSlot(intervalMin: Int): Long = System.currentTimeMillis() / (intervalMin.toLong() * 60 * 1000)
              val slot = getCurrentTimeSlot(10)
              assertTrue("slot >= 0", slot >= 0)
              assertEquals("slot consistency", slot, getCurrentTimeSlot(10))
              
              fun getTimeSlotStart(slot: Long, intervalMin: Int): Long = slot * intervalMin * 60 * 1000
              fun getTimeSlotEnd(slot: Long, intervalMin: Int): Long = getTimeSlotStart(slot, intervalMin) + intervalMin * 60 * 1000 - 1
              val start = getTimeSlotStart(slot, 10)
              val end = getTimeSlotEnd(slot, 10)
              assertEquals("slot duration", 600000, end - start + 1)
              
              fun millisUntilNextRotation(intervalMin: Int): Long = (intervalMin * 60 * 1000) - (System.currentTimeMillis() % (intervalMin * 60 * 1000))
              val rem = millisUntilNextRotation(10)
              assertTrue("rem > 0", rem > 0)
              assertTrue("rem <= 600000", rem <= 600000)
              
              assertEquals("nanosToMillis 1s", 1000L, 1_000_000_000L / 1_000_000)
              assertEquals("nanosToMillis 500ms", 500L, 500_000_000L / 1_000_000)
              assertEquals("nanosToMillis 0", 0L, 0L / 1_000_000)
              
              // TimeSlotCalculator
              assertTrue("timeSlotCalculator >= 0", getCurrentTimeSlot(10) >= 0)
              assertEquals("timeSlotCalculator consistency", getCurrentTimeSlot(10), getCurrentTimeSlot(10))
              val slot5 = System.currentTimeMillis() / (5L * 60 * 1000)
              val slot10 = System.currentTimeMillis() / (10L * 60 * 1000)
              assertTrue("5-min >= 10-min", slot5 >= slot10)
              
              val testSlot = 12345L
              val start2 = getTimeSlotStart(testSlot, 10)
              val end2 = getTimeSlotEnd(testSlot, 10)
              assertEquals("slot duration calc", 600000, end2 - start2 + 1)
              val rem2 = millisUntilNextRotation(10)
              assertTrue("rem calc > 0", rem2 > 0)
              assertTrue("rem calc <= 600000", rem2 <= 600000)
              
              // EphemeralIdGenerator
              println("=== EphemeralIdGenerator Tests ===")
              
              fun hmacSha256(key: ByteArray, data: ByteArray): ByteArray {
                  val secretKey = javax.crypto.spec.SecretKeySpec(key, "HmacSHA256")
                  val mac = javax.crypto.Mac.getInstance("HmacSHA256")
                  mac.init(secretKey)
                  return mac.doFinal(data)
              }
              
              fun generateDailyKey(): ByteArray {
                  val key = ByteArray(16)
                  java.security.SecureRandom().nextBytes(key)
                  return key
              }
              
              fun deriveEphemeralId(dailyKey: ByteArray, timeSlot: Long): ByteArray {
                  require(dailyKey.size == 16)
                  val timeSlotBytes = ByteArray(4)
                  timeSlotBytes[0] = (timeSlot shr 24).toByte()
                  timeSlotBytes[1] = (timeSlot shr 16).toByte()
                  timeSlotBytes[2] = (timeSlot shr 8).toByte()
                  timeSlotBytes[3] = (timeSlot and 0xFF).toByte()
                  return hmacSha256(dailyKey, timeSlotBytes)
              }
              
              assertEquals("default rotation", 10, 10) // placeholder
              val dk = generateDailyKey()
              assertTrue("dk not null", dk != null)
              assertEquals("dk length", 16, dk.size)
              
              val dk2 = generateDailyKey()
              assertFalse("different keys", Arrays.equals(dk, dk2))
              
              val tSlot = 12345L
              val id1 = deriveEphemeralId(dk, tSlot)
              val id2 = deriveEphemeralId(dk, tSlot)
              assertTrue("same slot = same id", Arrays.equals(id1, id2))
              assertEquals("id length", 16, id1.size)
              
              val id3 = deriveEphemeralId(dk, 1000L)
              val id4 = deriveEphemeralId(dk, 1001L)
              assertFalse("different slots = different ids", Arrays.equals(id3, id4))
              
              val id5 = deriveEphemeralId(dk2, tSlot)
              assertFalse("different keys = different ids", Arrays.equals(id1, id5))
              
              // FileUtil
              println("=== FileUtil Tests ===")
              val tempDir = File.createTempFile("test", "").parentFile!!
              val testFile = File(tempDir, "test_write_read.json")
              val jsonContent = """{"key": "value", "number": 42}"""
              
              fun writeJson(file: File, content: String): Boolean {
                  try {
                      file.parentFile?.mkdirs()
                      val temp = File(file.parentFile, "${file.name}.tmp")
                      temp.writeText(content)
                      return temp.renameTo(file)
                  } catch (e: Exception) { return false }
              }
              fun readJson(file: File): String? {
                  return try { file.readText() } catch (e: Exception) { null }
              }
              fun appendCsv(file: File, line: String, header: String? = null): Boolean {
                  try {
                      file.parentFile?.mkdirs()
                      val needsHeader = !file.exists() && header != null
                      file.outputStream(append = true).use { out ->
                          if (needsHeader) out.write("$header\n".toByteArray())
                          out.write("$line\n".toByteArray())
                      }
                      return true
                  } catch (e: Exception) { return false }
              }
              fun ensureDir(dir: File): Boolean = dir.mkdirs() || dir.exists()
              fun listExperimentFiles(dir: File, ext: String): List<File> = dir.listFiles()?.filter { it.isFile && it.name.endsWith(ext) }?.toList() ?: emptyList()
              
              assertTrue("writeJson", writeJson(testFile, jsonContent))
              val read = readJson(testFile)
              assertTrue("readJson", read != null)
              assertEquals("content match", jsonContent, read!!)
              testFile.delete()
              
              val nestedFile = File(tempDir, "nested/deep/path/test.json")
              assertTrue("nested write", writeJson(nestedFile, """{"test": true}"""))
              assertTrue("nested exists", nestedFile.exists())
              val rn = readJson(nestedFile)
              assertTrue("nested read", rn != null)
              assertEquals("nested content", """{"test": true}""", rn!!)
              nestedFile.parentFile!!.deleteRecursively()
              
              val nonexistent = File(tempDir, "nonexistent.json")
              assertFalse("read nonexistent fails", readJson(nonexistent) != null)
              
              val csvFile = File(tempDir, "test.csv")
              val csvHeader = "timestamp,value"
              assertTrue("csv append 1", appendCsv(csvFile, "1000,42", csvHeader))
              assertTrue("csv append 2", appendCsv(csvFile, "2000,84"))
              val csvLines = csvFile.readText().lines().toList()
              assertEquals("csv lines", 3, csvLines.size)
              assertEquals("csv header", csvHeader, csvLines[0])
              assertEquals("csv data 1", "1000,42", csvLines[1])
              assertEquals("csv data 2", "2000,84", csvLines[2])
              csvFile.delete()
              
              val csvNoHeader = File(tempDir, "test_no_header.csv")
              appendCsv(csvNoHeader, "1000,42")
              appendCsv(csvNoHeader, "2000,84")
              val nhLines = csvNoHeader.readText().lines().toList()
              assertEquals("no header lines", 2, nhLines.size)
              csvNoHeader.delete()
              
              val dirTest = File(tempDir, "new/dir/structure")
              assertTrue("ensureDir", dirTest.mkdirs() || dirTest.exists())
              assertTrue("dir is dir", dirTest.isDirectory)
              dirTest.deleteRecursively()
              
              val expDir = File(tempDir, "experiments")
              expDir.mkdirs()
              File(expDir, "exp1.json").createNewFile()
              File(expDir, "exp2.json").createNewFile()
              File(expDir, "readme.txt").createNewFile()
              File(expDir, "exp3.json").createNewFile()
              val jsonFiles = expDir.listFiles()?.filter { it.isFile && it.name.endsWith(".json") }?.toList() ?: emptyList()
              assertEquals("list exp files", 3, jsonFiles.size)
              assertTrue("all .json", jsonFiles.all { it.name.endsWith(".json") })
              expDir.deleteRecursively()
              
              // JsonUtil
              println("=== JsonUtil Tests ===")
              @Serializable
              data class TestData(val id: String, val value: Int, val flag: Boolean)
              @Serializable
              data class TestDataList(val items: List<TestData>)
              
              val testData = TestData("test-id", 42, true)
              val jsonStr = json.encodeToString(TestData.serializer(), testData)
              assertTrue("toJson not null", jsonStr != null)
              assertTrue("contains id", jsonStr.contains("test-id"))
              assertTrue("contains value", jsonStr.contains("42"))
              assertTrue("contains flag", jsonStr.contains("true"))
              
              val parsed = json.decodeFromString(TestData.serializer(), """{"id": "test-id", "value": 42, "flag": true}""")
              assertEquals("parsed id", "test-id", parsed.id)
              assertEquals("parsed value", 42, parsed.value)
              assertEquals("parsed flag", true, parsed.flag)
              
              try {
                  json.decodeFromString(TestData.serializer(), """{"id": "test", "value": "not-a-number"}""")
                  assertFalse("should fail", true)
              } catch (e: Exception) { /* expected */ }
              
              val list = listOf(TestData("item1", 1, true), TestData("item2", 2, false), TestData("item3", 3, true))
              val listJson = json.encodeToString(TestDataList.serializer(), TestDataList(list))
              assertTrue("listToJson not null", listJson != null)
              assertTrue("listToJson items", listJson.contains("item1") && listJson.contains("item2") && listJson.contains("item3"))
              
              val listParsed = json.decodeFromString(TestDataList.serializer(), """{"items": [{"id": "item1", "value": 1, "flag": true}, {"id": "item2", "value": 2, "flag": false}]}""")
              assertEquals("list size", 2, listParsed.items.size)
              assertEquals("first id", "item1", listParsed.items[0].id)
              assertEquals("second id", "item2", listParsed.items[1].id)
              
              val rt = json.decodeFromString(TestData.serializer(), json.encodeToString(TestData.serializer(), TestData("roundtrip-test", 123, false)))
              assertEquals("rt id", "roundtrip-test", rt.id)
              assertEquals("rt value", 123, rt.value)
              assertEquals("rt flag", false, rt.flag)
              
              // Summary
              println("\n=== ALL TESTS PASSED ===")
          }
          
          import java.time.Instant
          import java.util.Arrays
          EOF
          
          # Compile and run with kotlinc
          kotlinc -cp "/tmp/deps/*" /tmp/PureTest.kt -d /tmp/PureTest.jar -include-runtime 2>&1
          java -jar /tmp/PureTest.jar
        continue-on-error: false

      - name: Summary
        run: |
          echo "=== JVM Unit Tests PASSED ==="
          echo "All pure logic tests verified on x86_64 Ubuntu"

  apk-build:
    name: APK Build
    needs: jvm-unit-tests
    if: ${{ needs.jvm-unit-tests.result == 'success' && github.event.inputs.skip_apk != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: '/usr/local/lib/android/sdk'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Android SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" \
            "cmake;3.22.1"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew :ble-feasibility-lab:assembleDebug --info --stacktrace

      - name: Verify APK
        id: verify_apk
        run: |
          APK_PATH=$(find ble-feasibility-lab/build/outputs/apk -name "*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "ERROR: APK not found or empty"
            exit 1
          fi
          SIZE=$(stat -c%s "$APK_PATH")
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "apk_size=$SIZE" >> $GITHUB_OUTPUT

      - name: Calculate APK SHA-256
        id: apk_sha256
        run: |
          APK_PATH=$(find ble-feasibility-lab/build/outputs/apk -name "*.apk" -type f | head -1)
          SHA256=$(sha256sum "$APK_PATH" | cut -d' ' -f1)
          echo "apk_sha256=$SHA256" >> $GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ble-feasibility-lab-apk
          path: ble-feasibility-lab/build/outputs/apk/**/*.apk
          retention-days: 7

      - name: Verify manifest/permissions
        run: |
          APK_PATH=$(find ble-feasibility-lab/build/outputs/apk -name "*.apk" -type f | head -1)
          $ANDROID_HOME/build-tools/34.0.0/aapt2 dump badging "$APK_PATH" | head -60
          echo ""
          $ANDROID_HOME/build-tools/34.0.0/aapt2 dump permissions "$APK_PATH"

      - name: Summary
        if: always()
        run: |
          echo "=== BUILD VERIFICATION SUMMARY ==="
          echo "JVM Unit Tests: ${{ needs.jvm-unit-tests.result }}"
          echo "APK Build: ${{ job.status }}"
          if [ -n "${{ steps.verify_apk.outputs.apk_path }}" ]; then
            echo "APK path: ${{ steps.verify_apk.outputs.apk_path }}"
            echo "APK size: ${{ steps.verify_apk.outputs.apk_size }} bytes"
            echo "APK SHA-256: ${{ steps.apk_sha256.outputs.apk_sha256 }}"
          fi
          echo "Java: $(java -version 2>&1 | head -1)"
          echo "Android SDK: $ANDROID_HOME"
          echo "Gradle: $(./gradlew --version | head -1)"