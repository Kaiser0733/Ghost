name: BLE Feasibility Lab - Build Verification

on:
  push:
    branches: [main]
    paths:
      - 'ble-feasibility-lab/**'
      - '.github/workflows/ble-feasibility-lab-verification.yml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  workflow_dispatch:
    inputs:
      skip_apk:
        description: 'Skip APK build (test only)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    name: Build Verification (x86_64 Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      JAVA_VERSION: '17'
      GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx2048m -Dfile.encoding=UTF-8"'
      ANDROID_SDK_ROOT: '/opt/android-sdk'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Install Android SDK (manual)
        run: |
          # Install Android SDK command-line tools
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip
          
          # Accept licenses and install required packages
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" \
            "cmake;3.22.1"
          
          # Verify installation
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la $ANDROID_SDK_ROOT/
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --list_installed

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify Gradle wrapper
        run: ./gradlew --version

      - name: Run unit tests
        id: test
        run: |
          echo "Running unit tests for ble-feasibility-lab..."
          ./gradlew :ble-feasibility-lab:test --info --stacktrace
        continue-on-error: false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            ble-feasibility-lab/build/reports/tests/
            ble-feasibility-lab/build/test-results/
          retention-days: 7

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            ble-feasibility-lab/build/reports/problems/
          retention-days: 7

      - name: Build APK (assembleDebug)
        if: ${{ !inputs.skip_apk && steps.test.outcome == 'success' }}
        id: apk_build
        run: |
          echo "Building APK..."
          ./gradlew :ble-feasibility-lab:assembleDebug --info --stacktrace
        continue-on-error: false

      - name: Verify APK exists and non-empty
        if: ${{ !inputs.skip_apk && steps.test.outcome == 'success' }}
        id: verify_apk
        run: |
          APK_PATH=$(find ble-feasibility-lab/build/outputs/apk -name "*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK found"
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: APK is empty"
            exit 1
          fi
          SIZE=$(stat -c%s "$APK_PATH")
          echo "APK found: $APK_PATH"
          echo "APK size: $SIZE bytes"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "apk_size=$SIZE" >> $GITHUB_OUTPUT

      - name: Calculate APK SHA-256
        if: ${{ !inputs.skip_apk && steps.test.outcome == 'success' }}
        id: apk_sha256
        run: |
          APK_PATH=$(find ble-feasibility-lab/build/outputs/apk -name "*.apk" -type f | head -1)
          SHA256=$(sha256sum "$APK_PATH" | cut -d' ' -f1)
          echo "APK SHA-256: $SHA256"
          echo "apk_sha256=$SHA256" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        if: ${{ !inputs.skip_apk && steps.test.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ble-feasibility-lab-apk
          path: ble-feasibility-lab/build/outputs/apk/**/*.apk
          retention-days: 7

      - name: Extract and verify manifest/permissions
        if: ${{ !inputs.skip_apk && steps.test.outcome == 'success' }}
        run: |
          APK_PATH=$(find ble-feasibility-lab/build/outputs/apk -name "*.apk" -type f | head -1)
          echo "=== APK Manifest (via aapt2) ==="
          $ANDROID_SDK_ROOT/build-tools/34.0.0/aapt2 dump badging "$APK_PATH" | head -60
          echo ""
          echo "=== Permissions ==="
          $ANDROID_SDK_ROOT/build-tools/34.0.0/aapt2 dump permissions "$APK_PATH"

      - name: Capture Gradle warnings
        if: ${{ !inputs.skip_apk && steps.test.outcome == 'success' }}
        run: |
          echo "=== Gradle Build Summary ==="
          find ble-feasibility-lab/build/reports -name "*.html" -type f | head -5

      - name: Summary
        if: always()
        run: |
          echo "=== BUILD VERIFICATION SUMMARY ==="
          echo "Test result: ${{ steps.test.outcome }}"
          if [ "${{ inputs.skip_apk }}" != "true" ]; then
            echo "APK build: ${{ steps.apk_build.outcome }}"
            if [ -n "${{ steps.verify_apk.outputs.apk_path }}" ]; then
              echo "APK path: ${{ steps.verify_apk.outputs.apk_path }}"
              echo "APK size: ${{ steps.verify_apk.outputs.apk_size }} bytes"
              echo "APK SHA-256: ${{ steps.apk_sha256.outputs.apk_sha256 }}"
            fi
          fi
          echo "Java: $(java -version 2>&1 | head -1)"
          echo "Android SDK: $ANDROID_SDK_ROOT"
          echo "Gradle: $(./gradlew --version | head -1)"
          echo "Runner: ${{ runner.os }} ${{ runner.arch }}"